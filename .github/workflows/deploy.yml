# Builds the Astro site in site/ and publishes it to GitHub Pages.
# Runs on every push to main; the SEO check must pass before deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# Permissions GitHub Pages needs to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci          # exact versions from package-lock.json
      - run: npm run build
      - run: npm run check   # stop here if any page fails the SEO checks

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
